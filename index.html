<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEF3F6"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Six Flags Over Texas Field Guide</title>

<style>
/* Layout: phone-first park map on real walkways (pinch, tap, route), your plan in walking order, then the reference. Day palette in light, Fright Fest night in dark. */
:root{

  --fright:#D9581A; --food:#9A6A12; --help:#4A5866; --closed:#97A3AD;
  --area-op:.22;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110F18; --card:#1B1826; --ink:#ECE8F4; --muted:#A49DB5; --line:#2D2840;
  --map:#16131F; --walk:#2B2740; --walkedge:#0B0910; --lake:#1C2B4A; --lakeline:#2B4470; --tex:#FFFFFF; --accent:#FF7A3D; --gold:#F4C04A; --you:#F4C04A; --route:#F4C04A;
  --coaster:#FF6B4A; --thrill:#B48CFF; --family:#3CC7AE; --kids:#FF7FB4; --water:#5AB0FF;
  --fright:#FF8F3D; --food:#E0B050; --help:#9AA8B6; --closed:#5E5870;
  --area-op:.3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110F18; --card:#1B1826; --ink:#ECE8F4; --muted:#A49DB5; --line:#2D2840;
  --map:#16131F; --walk:#2B2740; --walkedge:#0B0910; --lake:#1C2B4A; --lakeline:#2B4470; --tex:#FFFFFF; --accent:#FF7A3D; --gold:#F4C04A; --you:#F4C04A; --route:#F4C04A;
  --coaster:#FF6B4A; --thrill:#B48CFF; --family:#3CC7AE; --kids:#FF7FB4; --water:#5AB0FF;
  --fright:#FF8F3D; --food:#E0B050; --help:#9AA8B6; --closed:#5E5870;

html,body{height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;overflow:hidden}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
@media (min-width:920px){.wrap{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .mapcol{position:sticky;top:12px}}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,7vw,40px);line-height:1}
h2{font-size:19px;line-height:1.1}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mapcol,.infocol{display:grid;gap:14px;min-width:0}
header{display:grid;gap:8px}
.sub{color:var(--muted);margin:0}
.herebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.herechip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;min-width:0}
.herechip i{width:12px;height:12px;border-radius:50%;background:var(--you);box-shadow:0 0 0 3px color-mix(in srgb,var(--you) 30%,transparent);flex:none}
.status{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status b{color:var(--fright);font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}

.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.app{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:1180px;margin:0 auto}
.topbar{display:flex;gap:8px;position:relative;z-index:6}
.search{position:relative;flex:1;min-width:0}
.sicon{position:absolute;left:13px;top:13px;width:20px;height:20px;color:var(--muted);pointer-events:none}

.res .rm{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.rhead{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px 2px}
.noresult{padding:12px 10px;color:var(--muted);font-size:14px}
.gps{height:46px;border-radius:14px;border:0;padding:0 16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:7px;flex:none}
.gps::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--you);box-shadow:0 0 0 3px color-mix(in srgb,var(--you) 35%,transparent)}
.gps.on{background:var(--you);color:#1a1405}
.gps.on::before{background:#1a1405;box-shadow:none}
.planpill{position:absolute;left:12px;bottom:44px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;padding:8px 14px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.attrib{position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--muted);pointer-events:none}
.mapbox{position:relative;background:var(--map);border:1px solid var(--line);border-radius:18px;overflow:hidden;flex:1;min-height:300px}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map.moving{cursor:grabbing}
#map.placing{cursor:crosshair}
.area{fill-opacity:var(--area-op);stroke:var(--map);stroke-width:18;stroke-linejoin:round}
.walk{fill:none;stroke:var(--walk);stroke-linecap:round;stroke-linejoin:round}
.walkcase{fill:none;stroke:var(--walkedge);stroke-linecap:round;stroke-linejoin:round}
.lake{fill:var(--lake);stroke:var(--lakeline);stroke-width:14}
.creek{fill:none;stroke:var(--lake);stroke-linecap:round;stroke-linejoin:round}
.shadow{fill:#000;opacity:.07}
.grain circle{fill:var(--tex);opacity:.06}
.stalk line{stroke-linecap:round}
.stalk text{font-family:var(--mono);font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--card);text-anchor:middle}
.scale{position:absolute;left:12px;bottom:12px;display:flex;align-items:flex-end;gap:10px;pointer-events:none;font-family:var(--mono);font-size:11px;color:var(--ink)}
.scale .bar{height:7px;border:2px solid var(--ink);border-top:0;transition:width .15s}
.scale .north{display:grid;justify-items:center;line-height:1;font-weight:500}
.scale .north svg{width:14px;height:18px;fill:var(--ink)}
.alabel{font-family:var(--display);fill:var(--muted);opacity:.9;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--map);letter-spacing:.04em}
.mk circle{stroke:var(--card)}
.mk text{font-family:var(--body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-linejoin:round;pointer-events:none}
.mk.closed circle{fill:var(--closed)}
.mk .glyph{font-family:var(--mono);font-weight:500;fill:var(--bg);stroke:none;text-anchor:middle;pointer-events:none}
.mk.done circle{fill-opacity:.35}
.mk.sel circle{stroke:var(--ink)}
#route{fill:none;stroke:var(--route);stroke-linecap:round;stroke-linejoin:round}
#routeHalo{fill:none;stroke:var(--card);stroke-linecap:round;stroke-linejoin:round;opacity:.9}
@media (prefers-reduced-motion:no-preference){#route{animation:march 1s linear infinite}@keyframes march{to{stroke-dashoffset:var(--dash,-22)}}}
.badge circle{fill:var(--ink);stroke:var(--card)}
.badge text{fill:var(--bg);font-family:var(--mono);font-weight:500;text-anchor:middle;pointer-events:none}
#you circle.core{fill:var(--you);stroke:var(--card)}
#you circle.ring{fill:var(--you);opacity:.25}
#you circle.acc{fill:var(--you);fill-opacity:.1;stroke:var(--you);stroke-opacity:.5}
#you path.cone{fill:var(--you);opacity:.45}
@media (prefers-reduced-motion:no-preference){#you circle.ring{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{transform:scale(.6);opacity:.45}100%{transform:scale(1.6);opacity:0}}}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.zoom button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700;line-height:1}
.zoom button.me{font-size:12px;font-family:var(--mono)}
.zoom button.on{background:var(--you);color:#1a1405;border-color:var(--you)}
.hint{position:absolute;left:10px;top:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--ink);max-width:calc(100% - 80px)}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:grid;gap:8px;max-height:60%;overflow:auto}
.sheet .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sheet h3{margin:0;font-size:18px;line-height:1.2}
.sheet .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.sheet p{margin:0;font-size:15px}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.x{border:0;background:transparent;font-size:22px;line-height:1;padding:2px 4px;color:var(--muted)}
.pill{font-family:var(--mono);font-size:12px;border-radius:6px;padding:2px 7px;background:color-mix(in srgb,var(--c,var(--muted)) 16%,transparent);color:var(--c,var(--ink));white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.panel.night{background:color-mix(in srgb,var(--fright) 9%,var(--card));border-color:color-mix(in srgb,var(--fright) 35%,var(--line))}
.panel p{margin:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.list{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:9px 6px}
.row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.row i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.row b{display:block;font-size:15px}
.row small{display:block;color:var(--muted);font-size:13px}
.row .r{display:grid;justify-items:end;gap:2px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.row .r em{font-style:normal;color:var(--muted);font-size:12px}
.row.isclosed b{text-decoration:line-through;color:var(--muted)}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{display:grid}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plan li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan .num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.plan li.isdone .num{background:var(--closed)}

.plan .nm{all:unset;cursor:pointer;font-weight:700;display:block}

.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:15px}
ol.steps{margin:0;padding-left:22px;display:grid;gap:8px}

.changes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.changes li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 6px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap}
@media (min-width:560px){.note{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);display:grid;gap:4px}
footer a{color:var(--muted)}
.new{color:var(--accent);font-family:var(--mono);font-size:11px;letter-spacing:.06em}
</style>

    (it.kind==='ride'?'<button type="button" class="btn small ghost'+(isDone?' on':'')+'" data-a="done">'+(isDone?'Ridden':'Mark ridden')+'</button>':'')+'</div>';
  sheet.innerHTML='<div class="top"><h3>'+esc(it.name)+'</h3><button class="x" type="button" aria-label="Close">&times;</button></div>'+
    '<div class="meta"><span class="pill" style="--c:var(--you)">'+(meters<25?'Right here':m+' min walk, '+meters+' m')+'</span>'+pills.join('')+'</div><p>'+esc(it.blurb)+'</p>'+acts;
  sheetMode='item';sheet.querySelector('.x').onclick=()=>select(null);
  const pb=sheet.querySelector('[data-a="plan"]');if(pb)pb.onclick=()=>{togglePlan(it.id);showSheet(it)};
  const db=sheet.querySelector('[data-a="done"]');if(db)db.onclick=()=>{toggleDone(it.id);showSheet(it)};
  sheet.hidden=false;
}
function select(id,fly=true){
  selected=id;
  if(!id){if(sheetMode!=='plan'){sheet.hidden=true;sheetMode=null}drawRoute();relayout();return}
  const it=byId[id],f=FILTERS.find(x=>x.k===filter);
  if(!f.test(it)&&!plan.includes(id))setFilter(it.kind==='ride'?'rides':it.kind,false);
  showSheet(it);drawRoute();
  if(fly){setFollow(false);const p=it.pts[0],s=size(),nw=Math.min(vb.w,2400);centerOn(p[0],p[1]+Math.min(nw*s.h/s.w*0.2,700),nw,true)}
  relayout();
}

// ---------- plan: shortest walking order ----------
let optimized={order:[],pts:[],legs:[],total:0,at:{}};
function recomputePlan(){
  const todo=plan.filter(id=>!done.has(id)&&byId[id].status!=='closed');
  if(!todo.length){optimized={order:[],pts:[],legs:[],total:0,at:{}};return}
  // pick each stop's nearest entrance point from you, then distance matrix over graph
  const stops=todo.map(id=>({id,sn:bestLeg(youField,byId[id]).sn}));
  const fields=stops.map(s=>field(s.sn.p));
  const n=stops.length,d0=stops.map(s=>legTo(youField,s.sn).d),Dm=stops.map((s,i)=>stops.map((t,j)=>i===j?0:legTo(fields[i],t.sn).d));
  // nearest neighbour, then 2-opt on the open path
  let order=[],left=new Set(stops.map((_,i)=>i)),cur=-1;
  while(left.size){let b=-1,bd=Infinity;left.forEach(j=>{const d=cur<0?d0[j]:Dm[cur][j];if(d<bd){bd=d;b=j}});order.push(b);left.delete(b);cur=b}
  const cost=o=>o.reduce((s,j,k)=>s+(k?Dm[o[k-1]][j]:d0[j]),0);
  let improved=true,best=cost(order);
  while(improved){improved=false;for(let i=0;i<n-1;i++)for(let k=i+1;k<n;k++){const o=order.slice(0,i).concat(order.slice(i,k+1).reverse(),order.slice(k+1));const c=cost(o);if(c+1e-6<best){best=c;order=o;improved=true}}}
  const pts=[],legs=[],at={};
  order.forEach((j,k)=>{const F=k?fields[order[k-1]]:youField;const r=routeTo(F,stops[j].sn);legs.push(r.d);(k?r.pts.slice(1):r.pts).forEach(p=>pts.push(p));at[stops[j].id]=stops[j].sn.p});
  optimized={order:order.map(j=>stops[j].id),pts,legs,total:best,at};
}
function savePlan(){store.set('sfot-plan',plan);store.set('sfot-done',[...done])}
function togglePlan(id){plan=plan.includes(id)?plan.filter(x=>x!==id):plan.concat(id);savePlan();recomputePlan();renderPlan();drawRoute();relayout()}
function toggleDone(id){done.has(id)?done.delete(id):done.add(id);savePlan();recomputePlan();renderPlan();renderList();drawRoute();relayout()}
let sheetMode=null;
const planPill=document.getElementById('planPill');
function renderPlan(){
  const left=optimized.order.length;planPill.hidden=!plan.length;
  if(plan.length)planPill.textContent=left?'My plan: '+left+' stops, '+mins(optimized.total)+' min':'Plan done';
  if(sheetMode==='plan')showPlanSheet();
}
function showPlanSheet(){
  sheetMode='plan';if(selected){selected=null;drawRoute();relayout()}
  const credits=items.filter(isCredit),got=credits.filter(it=>done.has(it.id)).length;
  const doneIds=plan.filter(id=>done.has(id)||byId[id].status==='closed');
  let h='<div class="top"><h3>My plan</h3><button class="x" type="button" aria-label="Close">&times;</button></div><div class="meta"><span class="pill" style="--c:var(--you)">'+got+'/'+credits.length+' coasters ridden</span>'+(optimized.order.length?'<span class="pill">'+mins(optimized.total)+' min walking</span>':'')+'</div><ul class="plan">';
  optimized.order.concat(doneIds).forEach((id,k)=>{const it=byId[id],isDone=done.has(id),inRoute=k<optimized.order.length;
    const leg=inRoute?mins(optimized.legs[k])+' min walk':isDone?'Ridden':'Closed';
    h+='<li class="'+(isDone?'isdone':'')+'"><span class="num">'+(inRoute?k+1:'\u2713')+'</span><span style="min-width:0"><button type="button" class="nm" data-go="'+id+'">'+esc(it.name)+'</button><small>'+esc(it.section)+', '+leg+'</small></span><span class="ck">'+
      (it.kind==='ride'?'<button type="button" class="'+(isDone?'on':'')+'" data-d="'+id+'">'+(isDone?'Ridden':'Ridden?')+'</button>':'')+'<button type="button" data-x="'+id+'" aria-label="Remove from plan">&#10005;</button></span></li>'});
  h+='</ul><div class="acts"><button type="button" class="btn small ghost" data-a="route">'+(showPlanRoute?'Hide route':'Show route')+'</button><button type="button" class="btn small ghost" data-a="clear">Clear plan</button></div>';
  sheet.innerHTML=h;sheet.hidden=false;
  sheet.querySelector('.x').onclick=()=>{sheetMode=null;sheet.hidden=true};
  sheet.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(b.dataset.go,true));
  sheet.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>toggleDone(b.dataset.d));
  sheet.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>togglePlan(b.dataset.x));
  sheet.querySelector('[data-a="route"]').onclick=()=>{showPlanRoute=!showPlanRoute;store.set('sfot-showplan',showPlanRoute);showPlanSheet();drawRoute();relayout()};
  sheet.querySelector('[data-a="clear"]').onclick=()=>{plan=[];savePlan();recomputePlan();sheetMode=null;sheet.hidden=true;renderPlan();drawRoute();relayout()};
}
planPill.onclick=showPlanSheet;
function planEveryCoaster(){plan=items.filter(isCredit).map(it=>it.id);savePlan();recomputePlan();showPlanRoute=true;store.set('sfot-showplan',true);select(null);renderPlan();drawRoute();relayout();mk2()}
function mk2(){const s=size();centerOn(4300,2100,Math.min(10000,Math.max(8300,8300*(4800/8300)/(s.h/s.w))),true)}

// ---------- filters, legend, list ----------
const chips=document.getElementById('chips');
FILTERS.forEach(f=>{const b=document.createElement('button');b.type='button';b.className='chip';b.dataset.k=f.k;b.style.setProperty('--c','var('+f.v+')');b.innerHTML='<i></i>'+f.n;b.onclick=()=>setFilter(f.k,true);chips.appendChild(b)});
function setFilter(k,userAction){
  filter=k;store.set('sfot-filter',k);chips.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k?'true':'false'));
  if(userAction&&selected&&!FILTERS.find(x=>x.k===k).test(byId[selected]))select(null);renderList();relayout();
}
function renderList(){if(!results.hidden)renderResults()}
function goTo(id){select(id,true)}

// ---------- search everything ----------
const q=document.getElementById('q'),results=document.getElementById('results'),qclear=document.getElementById('qclear');
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function kw(it){
  const k=[];
  if(it.kind==='ride'){k.push('ride');if(it.cats.includes('C'))k.push('coaster roller');if(it.cats.includes('T'))k.push('thrill scary big');if(it.cats.includes('F'))k.push('family');if(it.cats.includes('K'))k.push('kids kiddie little');if(it.cats.includes('W'))k.push('water wet splash');if(it.fl)k.push('fast lane')}
  if(it.kind==='ff')k.push('fright fest halloween haunt haunted house maze scare zone show spooky');
  if(it.kind==='food')k.push('food eat snack drink lunch dinner');
  if(it.refresh)k.push('coke coca cola refill soda drink water bottle refresh');
  if(/Restrooms/.test(it.name))k.push('restroom bathroom toilet wc potty pee');
  if(/Lockers/.test(it.name))k.push('locker bag storage');
  if(it.name==='First Aid')k.push('medical nurse hurt injury');
  if(it.id==='p0')k.push('exit entrance gate leave out front way out');
  if(it.id==='p1')k.push('help lost found tickets pass accessibility ada info information services');
  if(it.id==='p2')k.push('car parking lot toll');
  return k.join(' ');
}
items.forEach(it=>{it.nname=norm(it.name);it.hay=norm([it.name,it.type,it.section,kw(it)].join(' '));it.words=it.hay.split(' ')});
function search(str){
  const n=norm(str);if(!n)return[];const toks=n.split(' ');
  return items.map(it=>{let sc=0;
    if(it.nname.startsWith(n))sc=100;else if(it.nname.includes(n))sc=80;
    else if(toks.every(t=>it.words.some(w=>w.startsWith(t))))sc=60;else if(toks.every(t=>it.hay.includes(t)))sc=40;
    return{it,sc}}).filter(r=>r.sc).map(r=>({...r,d:bestLeg(youField,r.it).d})).sort((a,b)=>(a.it.status==='closed')-(b.it.status==='closed')||b.sc-a.sc||a.d-b.d).slice(0,40);
}
function nearestOf(pred){return items.filter(pred).map(it=>({it,d:bestLeg(youField,it).d})).sort((a,b)=>a.d-b.d)[0]}
const away=d=>d*M_PER_UNIT<25?'here':mins(d)+' min';
function suggestions(){
  const r=nearestOf(it=>/Restrooms/.test(it.name)),c=nearestOf(it=>it.refresh),e=nearestOf(it=>it.id==='p0'),g=nearestOf(it=>it.id==='p1'),f=nearestOf(it=>it.kind==='food'&&!it.refresh);
  return[
    {c:'var(--help)',n:'Nearest restroom',sub:r.it.name,right:away(r.d),go:()=>select(r.it.id,true)},
    {c:'var(--ink)',n:'Exit',sub:'Main entrance & exit',right:away(e.d),go:()=>select('p0',true)},
    {c:'var(--ink)',n:'Guest Relations',sub:'Tickets, lost and found, help',right:away(g.d),go:()=>select('p1',true)},
    {c:'var(--food)',n:'Nearest food',sub:f.it.name,right:away(f.d),go:()=>select(f.it.id,true)},
    {c:'var(--food)',n:'Coke refills',sub:c.it.name,right:away(c.d),go:()=>select(c.it.id,true)},
    {c:'var(--coaster)',n:'Plan every coaster',sub:'Shortest walking order from you',right:'',go:planEveryCoaster},
    {c:'var(--fright)',n:'Fright Fest',sub:'Houses open 6 pm, scare zones after dark',right:'',go:()=>setFilter('ff',true)}
  ];
}
let hl=0,rowsNow=[];
function renderResults(){
  const v=q.value;qclear.hidden=!v;
  rowsNow=v.trim()?search(v).map(r=>({c:colorOf(r.it),n:r.it.name,sub:(r.it.section?r.it.section+', ':'')+r.it.type.toLowerCase(),right:r.it.status==='closed'?'closed':away(r.d),go:()=>select(r.it.id,true)})):suggestions();
  hl=0;results.innerHTML=v.trim()?'':'<div class="rhead">Quick picks</div>';
  if(v.trim()&&!rowsNow.length)results.innerHTML='<div class="noresult">Nothing matches \u201c'+esc(v)+'\u201d. Try a ride name, food, restroom or exit.</div>';
  rowsNow.forEach((r,i)=>{const b=document.createElement('button');b.type='button';b.className='res'+(i===0&&v.trim()?' hl':'');
    b.innerHTML='<i style="background:'+r.c+'"></i><span style="min-width:0"><b>'+esc(r.n)+'</b><small>'+esc(r.sub)+'</small></span><span class="rm">'+r.right+'</span>';
    b.onclick=()=>pick(r);results.appendChild(b)});
  results.hidden=false;
}
function closeResults(){results.hidden=true}
function pick(r){closeResults();q.blur();r.go()}
q.addEventListener('focus',renderResults);
q.addEventListener('input',renderResults);
q.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeResults();q.blur()}
  else if(e.key==='Enter'){e.preventDefault();if(rowsNow[hl])pick(rowsNow[hl])}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const bs=results.querySelectorAll('.res');if(!bs.length)return;hl=(hl+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('hl',i===hl));bs[hl].scrollIntoView({block:'nearest'})}
});
q.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==q)closeResults()},150));
results.addEventListener('pointerdown',e=>e.preventDefault());
qclear.onclick=()=>{q.value='';q.focus();renderResults()};
svg.addEventListener('pointerdown',()=>{if(!results.hidden){closeResults();q.blur()}});

new ResizeObserver(()=>{const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;const s=size();vb.h=vb.w*s.h/s.w;vb.x=cx-vb.w/2;vb.y=cy-vb.h/2;apply()}).observe(svg);
recomputePlan();renderPlan();setFilter(filter,false);drawRoute();initialView();
try{if(location.hostname.indexOf('github.io')>=0&&navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(st=>{if(st.state==='granted')startGps()}).catch(()=>{})}catch(e){}
})();
</script>
